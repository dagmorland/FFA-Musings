name: Apply Release PR Template

on:
  pull_request:
    types: [opened]

jobs:
  inject-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Template Content
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/PULL_REQUEST_TEMPLATE.md';
            
            // If template exists on release branch, pre-fill empty PR descriptions
            if (fs.existsSync(path)) {
              const templateContent = fs.readFileSync(path, 'utf8');
              const currentBody = context.payload.pull_request.body || '';
              
              if (currentBody.trim().length === 0) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: templateContent
                });
              }
            }
