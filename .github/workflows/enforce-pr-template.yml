name: Enforce PR Template

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Linked Issue Exists
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            
            // 1. Check if the PR description is completely empty
            if (body.trim().length === 0) {
              core.setFailed("PR description is empty. Please fill out the PR template.");
              return;
            }

            // 2. Check if placeholders were left unchanged
            const uneditedPlaceholders = ["[Write summary here]", "Closes #<!-- Issue Number -->"];
            const hasPlaceholders = uneditedPlaceholders.some(p => body.includes(p));

            if (hasPlaceholders) {
              core.setFailed("Please fill out all required placeholders in the PR template before requesting a review.");
            }

            // Regex to find patterns like "Closes #123", "Fixes #123", or just "#123"
            const issueRegex = /(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)?\s*#(\d+)/gi;
            const matches = [...body.matchAll(issueRegex)];

            if (matches.length === 0) {
              core.setFailed("PR must reference at least one valid issue (e.g., 'Closes #123').");
              return;
            }

            // Verify each found issue exists and has the required label
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requiredLabel = "RAI"; // Change this to your required template label (e.g., "enhancement", "feature")

            for (const match of matches) {
              const issueNumber = parseInt(match[1], 10);
              try {
                const issueResponse = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                });

                const issue = issueResponse.data;

                // Ensure it's an issue and not a PR
                if (issue.pull_request) {
                  core.setFailed(`❌ #${issueNumber} is a Pull Request, not an Issue.`);
                  continue;
                }

                // Check if the issue has the required template label
                const hasRequiredLabel = issue.labels.some(label => label.name.toLowerCase() === requiredLabel.toLowerCase());

                if (!hasRequiredLabel) {
                  core.setFailed(`❌ Linked Issue #${issueNumber} does not have the required label: "${requiredLabel}". Make sure it was created using the correct template.`);
                  return;
                }

                console.log(`Verified issue #${issueNumber} exists and has the required "${requiredLabel}" label.`);
              } catch (error) {
                core.setFailed(`❌ Issue #${issueNumber} referenced in the PR description does not exist or could not be verified: ${error.message}`);
              }
            }
